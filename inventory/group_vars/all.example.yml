---
k3s_install_script_url: 'https://get.k3s.io'
k3s_bin_path: '/usr/local/bin/k3s'
k3s_version: 'v1.36.3+k3s1'
k3s_kubeconfig_remote_path: '/etc/rancher/k3s/k3s.yaml'
k3s_kubeconfig_local_path: '~/.kube/k3s.yaml'
k3s_allowed_unsafe_sysctls:
  - net.ipv4.ip_forward
  - net.ipv6.conf.all.forwarding
  - net.ipv6.conf.all.disable_ipv6
  - net.ipv4.conf.all.src_valid_mark

traefik_acme_email: 'username@example.com'

# Leave the following settings empty to use http challenge for ACME

# Wildcard HTTPS: create the provider credential Secret in kube-system first.
# traefik_acme_challenge: dns
# traefik_acme_dns_provider: cloudflare
# traefik_acme_dns_secret: traefik-dns
# Verify staging issuance before selecting production with a separate acme.json.
# traefik_acme_ca_server: https://acme-staging-v02.api.letsencrypt.org/directory
# traefik_acme_storage_file: acme-staging.json

# fail2ban SSH jail settings.
fail2ban_sshd_bantime: 1h
fail2ban_sshd_findtime: 10m
fail2ban_sshd_maxretry: 3
