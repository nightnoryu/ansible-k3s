---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 1
    updateStrategy:
      type: Recreate
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 128Mi
      path: /data
    additionalArguments:
      - "--certificatesresolvers.letsencrypt.acme.email={{ traefik_acme_email }}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/{{ traefik_acme_storage_file }}"
      - "--certificatesresolvers.letsencrypt.acme.caserver={{ traefik_acme_ca_server }}"
{% if traefik_acme_challenge == 'dns' %}
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider={{ traefik_acme_dns_provider }}"
{% if traefik_acme_dns_resolvers | length > 0 %}
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers={{ traefik_acme_dns_resolvers | join(',') }}"
{% endif %}
{% else %}
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
{% endif %}
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.transport.respondingtimeouts.readtimeout=300s"
{% if traefik_acme_challenge == 'dns' %}
    envFrom:
      - secretRef:
          name: {{ traefik_acme_dns_secret }}
    tlsStore:
      default:
        defaultGeneratedCert:
          resolver: letsencrypt
          domain:
            main: "*.{{ traefik_acme_wildcard_domains[0] }}"
{% if traefik_acme_wildcard_domains | length > 1 %}
            sans:
{% for domain in traefik_acme_wildcard_domains[1:] %}
              - "*.{{ domain }}"
{% endfor %}
{% endif %}
{% endif %}
    logs:
      access:
        enabled: true
        format: json
    service:
      spec:
        externalTrafficPolicy: Local
    ports:
      web:
        exposedPort: 80
      websecure:
        exposedPort: 443
