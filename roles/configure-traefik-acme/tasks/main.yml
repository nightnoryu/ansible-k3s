---
- name: Validate Traefik configuration
  ansible.builtin.assert:
    that:
      - traefik_acme_email is defined
      - traefik_acme_email | length > 0
      - k3s_bin_path is defined
      - traefik_acme_challenge in ['http', 'dns']
      - traefik_acme_challenge != 'dns' or traefik_acme_dns_provider | length > 0
      - traefik_acme_storage_file is match('^[a-zA-Z0-9_-]+[.]json$')
    fail_msg: Define traefik_acme_email and k3s_bin_path before configuring Traefik.

- name: Create HelmChartConfig
  ansible.builtin.template:
    src: traefik-config.yml
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    mode: '0644'

- name: Wait for traefik rollout
  ansible.builtin.command:
    cmd: >-
      {{ k3s_bin_path }} kubectl -n kube-system rollout status
      deployment/traefik --timeout=5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  when: not ansible_check_mode
