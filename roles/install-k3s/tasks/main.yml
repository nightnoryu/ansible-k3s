---
- name: Checking if required variables are defined
  ansible.builtin.fail:
    msg: "{{ item }} is not defined"
  when: item not in vars
  loop:
    - k3s_install_script_url
    - k3s_bin_path
    - k3s_version
    - k3s_kubeconfig_remote_path
    - k3s_kubeconfig_local_path

- name: Download k3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Run k3s install script
  ansible.builtin.command: /tmp/k3s-install.sh
  args:
    creates: "{{ k3s_bin_path }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: not ansible_check_mode

- name: Ensure k3s service is running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Read kubeconfig from control plane
  ansible.builtin.slurp:
    src: "{{ k3s_kubeconfig_remote_path }}"
  register: k3s_kubeconfig_content
  when: not ansible_check_mode

- name: Download kubeconfig to local machine
  ansible.builtin.copy:
    content: >-
      {{ k3s_kubeconfig_content.content | b64decode
         | regex_replace('https://127.0.0.1:6443',
                         'https://' + ansible_ssh_host + ':6443') }}
    dest: "{{ k3s_kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode
