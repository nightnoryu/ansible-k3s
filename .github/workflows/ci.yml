name: CI

on:
  pull_request:
    paths: &code-paths
      - '**/*.yml'
      - '**/*.yaml'
      - '.yamllint'
      - '.ansible-lint'
      - 'mise.toml'
      - '.github/workflows/ci.yml'
  push:
    branches: [ main ]
    paths: *code-paths

permissions:
  contents: read

jobs:
  lint:
    name: Check with yamllint and ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install Ansible collections
        run: mise run collections

      - name: Run checks
        run: mise check
